<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频与音乐同步播放</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0b0b0b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            padding: 16px;
        }
        .wrapper {
            max-width: 1200px;
            width: 100%;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            background: #000;
        }
        video {
            display: block;
            width: 100%;
            height: auto;
            max-height: 85vh;
            object-fit: contain;
            background: #000;
            outline: none;
        }
        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: #1a1a1a;
            color: #ddd;
            font-size: 0.9rem;
            border-top: 1px solid #2a2a2a;
        }
        .info-bar span {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff9800;
            transition: background 0.3s;
        }
        .status-dot.playing {
            background: #4caf50;
        }
        .info-bar button {
            background: #2c2c2c;
            border: 1px solid #3a3a3a;
            color: #eee;
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s, transform 0.1s;
        }
        .info-bar button:hover {
            background: #3a3a3a;
        }
        .info-bar button:active {
            transform: scale(0.96);
        }
        @media (max-width: 600px) {
            .info-bar {
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;
            }
            .info-bar button {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <video
            id="autoVideo"
            muted
            loop
            playsinline
            preload="auto"
        >
            <source src="yayiziyou.mp4" type="video/mp4">
            您的浏览器不支持 HTML5 视频。
        </video>

        <div class="info-bar">
            <span>
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">已停止</span>
            </span>
            <button id="togglePlayBtn">
                <span id="btnIcon">▶️</span> <span id="btnText">播放</span>
            </button>
        </div>
    </div>

    <!-- 隐藏的 MP3：负责出声 -->
    <audio id="bgMusic" loop>
        <source src="78.mp3" type="audio/mpeg">
    </audio>

    <script>
        (function() {
            const video = document.getElementById('autoVideo');
            const audio = document.getElementById('bgMusic');
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const togglePlayBtn = document.getElementById('togglePlayBtn');
            const btnIcon = document.getElementById('btnIcon');
            const btnText = document.getElementById('btnText');

            let isFirstPlay = true;

            function updateUI() {
                if (video.paused) {
                    statusDot.classList.remove('playing');
                    statusText.textContent = '已停止';
                    btnIcon.textContent = '▶️';
                    btnText.textContent = '播放';
                } else {
                    statusDot.classList.add('playing');
                    if (!audio.paused && !audio.muted) {
                        statusText.textContent = '正在播放 (有声音)';
                    } else {
                        statusText.textContent = '正在播放 (静音)';
                    }
                    btnIcon.textContent = '⏸️';
                    btnText.textContent = '暂停';
                }
            }

            function syncAudioWithVideo() {
                if (video.paused) return;
                if (Math.abs(audio.currentTime - video.currentTime) > 0.3) {
                    audio.currentTime = video.currentTime;
                }
                audio.muted = false;
                audio.play().catch(err => {
                    console.warn('音频播放被拦截，需要用户再次点击:', err);
                });
            }

            function startPlay() {
                if (isFirstPlay) {
                    video.muted = false;
                    isFirstPlay = false;
                }
                video.play().then(() => {
                    syncAudioWithVideo();
                    updateUI();
                }).catch(e => {
                    console.log('视频播放失败:', e);
                });
            }

            function pausePlay() {
                video.pause();
                audio.pause();
                updateUI();
            }

            function togglePlay() {
                if (video.paused) {
                    startPlay();
                } else {
                    pausePlay();
                }
            }

            togglePlayBtn.addEventListener('click', togglePlay);

            video.addEventListener('play', updateUI);
            video.addEventListener('pause', updateUI);

            video.addEventListener('seeked', () => {
                if (!video.paused) {
                    audio.currentTime = video.currentTime;
                }
            });

            audio.addEventListener('play', updateUI);
            audio.addEventListener('pause', () => {
                if (!video.paused) {
                    updateUI();
                }
            });

            updateUI();
        })();
    </script>

</body>
</html>
